org.gradle.jvmargs=-Xms512m -Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Enable Gradle optimizations for faster builds (optimized for 4GB RAM)
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.workers.max=1
org.gradle.vfs.watch=false

# Reduce Kotlin daemon memory for 4GB RAM systems
kotlin.daemon.jvm.options=-Xmx512m

# Pin Java home to JDK 22 
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-22

# Suppress AGP warning for compileSdk 36
android.suppressUnsupportedCompileSdk=36
