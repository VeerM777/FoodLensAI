# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
# CRITICAL: Ultra performance-optimized configuration for crash prevention

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

# CRITICAL: Ultra performance-optimized analyzer configuration for crash prevention
analyzer:
  # Reduce analysis overhead by excluding heavy directories - Enhanced
  exclude:
    - build/**
    - .dart_tool/**
    - ios/Pods/**
    - android/.gradle/**
    - web/build/**
    - android/app/build/**
    - ios/build/**
    - linux/build/**
    - macos/build/**
    - windows/build/**
    - coverage/**
    - test/coverage/**
    - .nyc_output/**
    - .pub-cache/**
    - pubspec.lock
    - .packages
    - .flutter-plugins
    - .flutter-plugins-dependencies
  
  # CRITICAL: Limit concurrent analysis for ultra-low memory usage
  strong-mode:
    implicit-casts: true
    implicit-dynamic: true
  
  # CRITICAL: Disable expensive analysis features completely
  enable-experiment: []
  
  # CRITICAL: Language configuration for crash prevention
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

# CRITICAL: Ultra minimal lint rules for crash prevention - Only essential safety rules
linter:
  rules:
    # Core safety rules only - Absolutely essential
    avoid_empty_else: true
    cancel_subscriptions: true
    close_sinks: true
    
    # CRITICAL: Disable ALL performance-heavy rules for crash prevention
    avoid_print: false
    prefer_single_quotes: false
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    avoid_unnecessary_containers: false
    prefer_const_declarations: false
    unnecessary_const: false
    unnecessary_new: false
    prefer_final_fields: false
    prefer_final_in_for_each: false
    prefer_final_locals: false
    prefer_for_elements_to_map_fromIterable: false
    prefer_collection_literals: false
    prefer_conditional_assignment: false
    prefer_contains: false
    prefer_equal_for_default_values: false
    prefer_generic_function_type_aliases: false
    prefer_if_null_operators: false
    prefer_initializing_formals: false
    prefer_inlined_adds: false
    prefer_is_empty: false
    prefer_is_not_empty: false
    prefer_iterable_whereType: false
    prefer_null_aware_operators: false
    prefer_relative_imports: false
    prefer_spread_collections: false
    prefer_typing_uninitialized_variables: false
    prefer_void_to_null: false
    
    # Disable formatting rules to reduce CPU usage
    sort_child_properties_last: false
    sort_constructors_first: false
    sort_unnamed_constructors_first: false
    
    # Disable documentation rules
    public_member_api_docs: false
    
    # Disable style rules
    camel_case_types: false
    camel_case_extensions: false
    file_names: false
